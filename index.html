<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WakuWaku Family - 動態電競賽程引擎</title>
    <!-- 新增 Favicon (內嵌 SVG 手把圖示) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='6' y1='12' x2='10' y2='12'%3E%3C/line%3E%3Cline x1='8' y1='10' x2='8' y2='14'%3E%3C/line%3E%3Cline x1='15' y1='13' x2='15.01' y2='13'%3E%3C/line%3E%3Cline x1='18' y1='11' x2='18.01' y2='11'%3E%3C/line%3E%3Cpath d='M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z'%3E%3C/path%3E%3C/svg%3E">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #e2e8f0; /* slate-200 */
            min-height: 100vh;
            /* 科技感網格背景 */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* 毛玻璃與光暈特效 */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        /* 投票選取動畫 */
        .voter-chip.selected {
            ring: 2px;
            ring-color: #f59e0b; /* amber-500 */
            background-color: #78350f; /* amber-900 */
            border-color: #f59e0b;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .player-card.selectable:hover {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            cursor: pointer;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="relative">

    <div id="app" class="p-4 md:p-8 relative z-10">
        <!-- UI 渲染區域 -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 🔒 登入帳號與密碼設定 (您可以在這裡自行更改)
        // ==========================================
        const APP_USERNAME = "Za";
        const APP_PASSWORD = "waku";
        
        // 取得當前登入狀態
        let isLoggedIn = localStorage.getItem('waku_logged_in') === 'true';

        const isLocalMode = window.location.protocol === 'file:';
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dynamic-tournament-html';

        // --- 核心狀態 ---
        let appState = {
            config: { groupSize: 2, isDoubleElim: false },
            matches: [],
            losersPool: [], // 敗部待戰區
            voters: [], // 投票者名單 { id, name, votedFor: null }
            unassignedPlayers: [] // 🌟 新增：待手動分配的選手池
        };
        let isLoading = true;
        let activeTab = 'board'; // 'board' (賽程) | 'voting' (投票)
        let selectedVoterId = null; // 記錄當前選取的投票者，用於分配
        let selectedPlayerId = null; // 🌟 新增：記錄當前選取的待分配選手

        // --- Firebase 設定 ---
        let db, auth;
        if (!isLocalMode) {
            try {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "AIzaSyA2xUt1tsmv6xJPeUAVrt4LpP7JtJJUGJk",
                    authDomain: "champion-3ceb6.firebaseapp.com",
                    projectId: "champion-3ceb6"
                };
                const fbApp = initializeApp(config);
                auth = getAuth(fbApp);
                db = getFirestore(fbApp);
            } catch (e) { console.error("Firebase Init Error:", e); }
        }

        // --- 系統初始化 (加入畫面防呆除錯機制) ---
        async function initApp() {
            if (isLocalMode) {
                const saved = localStorage.getItem('tournament_state');
                if (saved) {
                    appState = JSON.parse(saved);
                    if (!appState.voters) appState.voters = []; 
                    if (!appState.unassignedPlayers) appState.unassignedPlayers = []; // 確保相容舊資料
                }
                isLoading = false;
                render();
            } else {
                try {
                    // 嘗試匿名登入 Firebase
                    await signInAnonymously(auth);
                    
                    const stateRef = doc(db, 'artifacts', appId, 'public', 'tournament_state');
                    onSnapshot(stateRef, (docSnap) => {
                        if (docSnap.exists()) {
                            appState = docSnap.data();
                            if (!appState.voters) appState.voters = [];
                            if (!appState.unassignedPlayers) appState.unassignedPlayers = [];
                        }
                        isLoading = false;
                        render();
                    }, (error) => {
                        // Firestore 讀取失敗時的畫面
                        console.error("Firestore Error:", error);
                        let errMsg = error.message;
                        let errTitle = "資料庫連線失敗";
                        
                        // 🌟 優化：針對「正式規則 (if false)」的權限錯誤進行精準提示
                        if (error.code === 'permission-denied') {
                            errTitle = "Firestore 權限被拒絕";
                            errMsg = `
                                您目前的 Firestore 安全性規則可能設定為 <code>if false;</code>，導致網頁無法讀取資料。<br><br>
                                <span class="text-white">請前往 Firebase 控制台修改規則：</span><br>
                                1. 點擊左側 <b>Firestore Database</b><br>
                                2. 切換到 <b>規則 (Rules)</b> 頁籤<br>
                                3. 將 <code>allow read, write: if false;</code><br>
                                   改為 <code class="text-emerald-400 font-bold">allow read, write: if request.auth != null;</code><br>
                                4. 點擊<b>發布 (Publish)</b>
                            `;
                        }

                        document.getElementById('app').innerHTML = `
                            <div class="flex items-center justify-center min-h-[80vh]">
                                <div class="bg-slate-800 p-8 rounded-2xl border border-rose-500 text-center shadow-2xl max-w-lg">
                                    <i data-lucide="database" class="w-12 h-12 text-rose-500 mx-auto mb-4"></i>
                                    <h2 class="text-xl font-bold text-white mb-4">${errTitle}</h2>
                                    <p class="text-slate-300 text-sm leading-relaxed text-left bg-slate-900 p-4 rounded-lg border border-slate-700">${errMsg}</p>
                                </div>
                            </div>`;
                        lucide.createIcons();
                    });
                } catch (e) {
                    console.error("Auth Error", e);
                }
            }
        }

        // --- 登入邏輯 ---
        window.handleLogin = () => {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            if (u === APP_USERNAME && p === APP_PASSWORD) {
                isLoggedIn = true;
                localStorage.setItem('waku_logged_in', 'true');
                isLoading = true;
                render(); // 先渲染 Loading 畫面
                initApp(); // 登入成功後才初始化讀取資料庫
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = () => {
            if(confirm("確定要登出系統嗎？")) {
                isLoggedIn = false;
                localStorage.removeItem('waku_logged_in');
                render();
            }
        };

        // --- 儲存狀態 ---
        async function saveState() {
            if (isLocalMode) {
                localStorage.setItem('tournament_state', JSON.stringify(appState));
                render();
            } else {
                const stateRef = doc(db, 'artifacts', appId, 'public', 'tournament_state');
                await setDoc(stateRef, appState);
            }
        }

        function chunkArray(array, size) {
            const result = [];
            for (let i = 0; i < array.length; i += size) result.push(array.slice(i, i + size));
            return result;
        }

        // 🌟 新增：標準洗牌演算法 (Fisher-Yates) 確保真正的隨機性
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getAlivePlayers() {
            if (!appState || appState.matches.length === 0) return [];
            
            const allPlayersMap = new Map();
            appState.matches.forEach(m => m.participants.forEach(p => { if (p) allPlayersMap.set(p.id, p); }));

            const nonWinnersIds = new Set();
            
            appState.matches.forEach(m => {
                if (m.bracket === 'winners' && m.status === 'completed') {
                    m.participants.forEach(p => {
                        if (p && p.id !== m.winnerId) {
                            nonWinnersIds.add(p.id);
                        }
                    });
                }
            });

            return Array.from(allPlayersMap.values()).filter(p => !nonWinnersIds.has(p.id));
        }

        window.startTournament = () => {
            const namesText = document.getElementById('playerList').value;
            let names = namesText.split('\n').map(n => n.trim()).filter(n => n !== '');
            const groupSize = parseInt(document.getElementById('groupSize').value) || 2;
            const isDoubleElim = document.getElementById('doubleElim').checked;
            const isAutoAssign = document.getElementById('autoAssignList').checked; // 🌟 讀取是否自動分組

            // 過濾重複的參賽玩家名稱
            const uniqueNames = [...new Set(names)];
            if (names.length !== uniqueNames.length) {
                alert(`系統已自動過濾 ${names.length - uniqueNames.length} 個重複的參賽玩家名稱！`);
            }
            names = uniqueNames;

            if (names.length < 2) { alert("請至少輸入 2 名不重複的參賽玩家！"); return; }

            const participants = names.map((name, i) => ({ id: 'p_' + Date.now() + '_' + i, name }));
            const numMatches = Math.ceil(participants.length / groupSize);
            let initialMatches = [];
            let unassignedPlayers = [];

            // 🌟 判斷：系統自動洗牌分配 vs 手動分配
            if (isAutoAssign) {
                shuffleArray(participants);
                const chunks = chunkArray(participants, groupSize);
                initialMatches = chunks.map((chunk, index) => ({
                    id: 'm_w_1_' + index,
                    bracket: 'winners',
                    round: 1,
                    title: `勝部 R1 - 第 ${index + 1} 場`,
                    participants: chunk,
                    winnerId: null,
                    status: 'pending'
                }));
            } else {
                // 手動模式：建立空賽事，並將所有人放入待分配區
                for (let i = 0; i < numMatches; i++) {
                    initialMatches.push({
                        id: 'm_w_1_' + i,
                        bracket: 'winners',
                        round: 1,
                        title: `勝部 R1 - 第 ${i + 1} 場`,
                        participants: [],
                        winnerId: null,
                        status: 'pending'
                    });
                }
                unassignedPlayers = participants;
            }

            appState = { config: { groupSize, isDoubleElim }, matches: initialMatches, losersPool: [], voters: [], unassignedPlayers };
            activeTab = 'board';
            selectedPlayerId = null;
            saveState();
        };

        window.resolveMatch = (matchId, winnerId) => {
            const match = appState.matches.find(m => m.id === matchId);
            if (!match || match.status === 'completed') return;

            match.status = 'completed';
            match.winnerId = winnerId;

            if (appState.config.isDoubleElim) {
                if (match.bracket === 'winners') {
                    const losers = match.participants.filter(p => p.id !== winnerId);
                    appState.losersPool.push(...losers);
                } else if (match.bracket === 'losers') {
                    const winner = match.participants.find(p => p.id === winnerId);
                    if (winner) appState.losersPool.push(winner);
                }
            }
            saveState();
        };

        window.generateNextWinnersRound = () => {
            const winnersMatches = appState.matches.filter(m => m.bracket === 'winners');
            if (winnersMatches.length === 0) return;
            
            const highestRound = Math.max(...winnersMatches.map(m => m.round));
            const currentRoundMatches = winnersMatches.filter(m => m.round === highestRound);
            
            if (currentRoundMatches.some(m => m.status === 'pending')) {
                alert("請先結算完本輪所有勝部賽事！"); return;
            }

            const advancingPlayers = currentRoundMatches.map(m => m.participants.find(p => p.id === m.winnerId)).filter(p => p);
            if (advancingPlayers.length <= 1) {
                alert("勝部已經只剩最後一人，無法再產生下一輪了！"); return;
            }

            // 🌟 判斷是否自動亂數洗牌
            const isAutoAssign = document.getElementById('autoAssign_winners') ? document.getElementById('autoAssign_winners').checked : true;

            const customSizeInput = document.getElementById('nextSize_winners');
            const customSize = customSizeInput ? parseInt(customSizeInput.value) : appState.config.groupSize;
            const nextRound = highestRound + 1;
            
            let newMatches = [];

            if (isAutoAssign) {
                shuffleArray(advancingPlayers);
                const chunks = chunkArray(advancingPlayers, customSize);
                newMatches = chunks.map((chunk, index) => ({
                    id: `m_w_${nextRound}_${index}_${Date.now()}`,
                    bracket: 'winners',
                    round: nextRound,
                    title: `勝部 R${nextRound} - 第 ${index + 1} 場`,
                    participants: chunk,
                    winnerId: null,
                    status: 'pending'
                }));
            } else {
                // 手動分配模式
                const numMatches = Math.ceil(advancingPlayers.length / customSize);
                for (let i = 0; i < numMatches; i++) {
                    newMatches.push({
                        id: `m_w_${nextRound}_${i}_${Date.now()}`,
                        bracket: 'winners',
                        round: nextRound,
                        title: `勝部 R${nextRound} - 第 ${i + 1} 場`,
                        participants: [],
                        winnerId: null,
                        status: 'pending'
                    });
                }
                appState.unassignedPlayers.push(...advancingPlayers);
            }

            appState.matches.push(...newMatches);
            saveState();
        };

        window.generateNextLosersRound = () => {
            if (appState.losersPool.length < 2) {
                alert("敗部待戰區人數不足，無法產生賽事！(目前 " + appState.losersPool.length + " 人)"); return;
            }

            const customSizeInput = document.getElementById('nextSize_losers');
            const customSize = customSizeInput ? parseInt(customSizeInput.value) : appState.config.groupSize;

            const losersMatches = appState.matches.filter(m => m.bracket === 'losers');
            const highestRound = losersMatches.length > 0 ? Math.max(...losersMatches.map(m => m.round)) : 0;
            const nextRound = highestRound + 1;

            const playersToMatch = [...appState.losersPool];
            
            // 🌟 判斷是否自動亂數洗牌
            const isAutoAssign = document.getElementById('autoAssign_losers') ? document.getElementById('autoAssign_losers').checked : true;
            
            let newMatches = [];

            if (isAutoAssign) {
                shuffleArray(playersToMatch); 
                const chunks = chunkArray(playersToMatch, customSize);
                newMatches = chunks.map((chunk, index) => ({
                    id: `m_l_${nextRound}_${index}_${Date.now()}`,
                    bracket: 'losers',
                    round: nextRound,
                    title: `敗部 R${nextRound} - 第 ${index + 1} 場`,
                    participants: chunk,
                    winnerId: null,
                    status: 'pending'
                }));
            } else {
                // 手動分配模式
                const numMatches = Math.ceil(playersToMatch.length / customSize);
                for (let i = 0; i < numMatches; i++) {
                    newMatches.push({
                        id: `m_l_${nextRound}_${i}_${Date.now()}`,
                        bracket: 'losers',
                        round: nextRound,
                        title: `敗部 R${nextRound} - 第 ${i + 1} 場`,
                        participants: [],
                        winnerId: null,
                        status: 'pending'
                    });
                }
                appState.unassignedPlayers.push(...playersToMatch);
            }

            appState.matches.push(...newMatches);
            appState.losersPool = []; 
            saveState();
        };

        // 撤銷最後一輪賽事功能
        window.undoLastRound = (bracketType) => {
            const matches = appState.matches.filter(m => m.bracket === bracketType);
            if (matches.length === 0) return;

            const highestRound = Math.max(...matches.map(m => m.round));
            if (highestRound === 1) {
                alert("第一輪賽事無法撤銷！如果想重新分組，請直接刪除重置整個賽事。");
                return;
            }

            const currentRoundMatches = matches.filter(m => m.round === highestRound);
            
            // 檢查：如果該輪已經有任何一場比賽結算了，就禁止撤銷
            if (currentRoundMatches.some(m => m.status === 'completed')) {
                alert(`Round ${highestRound} 已經有比賽結算了，無法撤銷！`);
                return;
            }

            if(confirm(`確定要撤銷 ${bracketType === 'winners' ? '勝部' : '敗部'} 的 Round ${highestRound} 嗎？\n這將刪除該輪所有賽事，並允許您重新設定人數後再次生成。`)) {
                // 如果是敗部，我們需要把玩家「退回」待戰區
                if (bracketType === 'losers') {
                    const playersToReturn = [];
                    currentRoundMatches.forEach(m => {
                        playersToReturn.push(...m.participants);
                    });
                    appState.losersPool.push(...playersToReturn);
                }

                // 刪除該輪的所有賽事，並清空手動分配池避免重複
                appState.matches = appState.matches.filter(m => !(m.bracket === bracketType && m.round === highestRound));
                appState.unassignedPlayers = []; 
                selectedPlayerId = null;
                saveState();
            }
        };

        window.resetTournament = () => {
            if(confirm("確定要刪除當前賽事並重新建立嗎？所有紀錄將會消失。")) {
                appState = { config: { groupSize: 2, isDoubleElim: false }, matches: [], losersPool: [], voters: [], unassignedPlayers: [] };
                activeTab = 'board';
                selectedVoterId = null;
                selectedPlayerId = null;
                saveState();
            }
        };

        window.setTab = (tabName) => {
            activeTab = tabName;
            selectedVoterId = null; 
            selectedPlayerId = null;
            render();
        };

        // 🌟 新增：賽程手動分配邏輯
        window.selectPlayerToAssign = (playerId) => {
            selectedPlayerId = selectedPlayerId === playerId ? null : playerId;
            render();
        };

        window.assignPlayerToMatch = (matchId) => {
            if (!selectedPlayerId) return;
            const match = appState.matches.find(m => m.id === matchId);
            // 檢查賽事是否存在、是否已結算、是否人數已滿
            if (!match || match.status === 'completed' || match.participants.length >= appState.config.groupSize) return;

            const pIndex = appState.unassignedPlayers.findIndex(p => p.id === selectedPlayerId);
            if (pIndex !== -1) {
                const player = appState.unassignedPlayers.splice(pIndex, 1)[0];
                match.participants.push(player);
                selectedPlayerId = null; // 分配後重置選取狀態
                saveState();
            }
        };

        window.removePlayerFromMatch = (matchId, playerId) => {
            const match = appState.matches.find(m => m.id === matchId);
            if (!match || match.status === 'completed') return;

            const pIndex = match.participants.findIndex(p => p.id === playerId);
            if (pIndex !== -1) {
                const player = match.participants.splice(pIndex, 1)[0];
                if (!appState.unassignedPlayers) appState.unassignedPlayers = [];
                appState.unassignedPlayers.push(player);
                saveState();
            }
        };

        window.setupVoters = () => {
            const namesText = document.getElementById('voterInputList').value;
            const names = namesText.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) { alert("請至少輸入 1 名投票者！"); return; }

            // 🌟 新增：過濾重複的投票者
            const uniqueInputNames = [...new Set(names)];
            
            // 過濾已經存在於資料庫中的投票者，防止重複添加
            const existingNames = new Set((appState.voters || []).map(v => v.name));
            const finalNames = uniqueInputNames.filter(n => !existingNames.has(n));

            const duplicateCount = names.length - finalNames.length;
            if (duplicateCount > 0) {
                alert(`系統已自動過濾 ${duplicateCount} 個重複的投票者！`);
            }

            if (finalNames.length === 0) return; // 如果全部都重複，就不執行後續新增

            const newVoters = finalNames.map((name, i) => ({ id: 'v_' + Date.now() + '_' + i, name: name, votedFor: null }));
            appState.voters = [...(appState.voters || []), ...newVoters];
            saveState();
            
            document.getElementById('voterInputList').value = ''; // 清空輸入框
        };

        window.resetVoters = () => {
            if(confirm("確定要清空所有投票者名單嗎？這將會刪除所有分配紀錄。")) {
                appState.voters = [];
                selectedVoterId = null;
                saveState();
            }
        };

        window.selectVoter = (voterId) => {
            selectedVoterId = selectedVoterId === voterId ? null : voterId;
            render();
        };

        window.assignVoteToPlayer = (playerId) => {
            if (!selectedVoterId) return; 

            const voterIndex = appState.voters.findIndex(v => v.id === selectedVoterId);
            if (voterIndex !== -1) {

            }
        };

            const voterIndex = appState.voters.findIndex(v => v.id === voterId);

            html += renderBracketGroup('勝部賽程 (Winners Bracket)', 'indigo', winners, 'winners');

            if (appState.config.isDoubleElim) {
                html += renderBracketGroup(`敗部賽程 (Losers Bracket)`, 'rose', losers, 'losers');
            }

            html += `</div>`;
            return html;
        }

        function renderBracketGroup(title, colorName, matches, bracketType) {
            const colorClass = `text-${colorName}-400`;
            const bgClass = `bg-${colorName}-500`;
            const borderClass = `border-${colorName}-500/30`;
            const iconName = bracketType === 'winners' ? 'trophy' : 'shield-alert';
            
            const rounds = {};
            let highestRoundNumber = 0; // 記錄最高輪次，用於判斷是否顯示撤銷按鈕
            matches.forEach(m => {
                if (!rounds[m.round]) rounds[m.round] = [];
                rounds[m.round].push(m);
                if (m.round > highestRoundNumber) highestRoundNumber = m.round;
            });

            let sectionHtml = `
                <section class="glass-panel p-6 md:p-8 rounded-2xl border ${borderClass}">
                    <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-700/50">
                        <h2 class="text-2xl font-black ${colorClass} flex items-center tracking-wide">
                            <div class="p-2 bg-${colorName}-500/20 rounded-lg mr-3 border border-${colorName}-500/30">
                                <i data-lucide="${iconName}" class="w-6 h-6"></i>
                            </div>
                            ${title}
                        </h2>
                    </div>
            `;

            if (Object.keys(rounds).length === 0) {
                sectionHtml += `<div class="text-slate-500 text-center py-12 italic flex flex-col items-center"><i data-lucide="ghost" class="w-12 h-12 mb-3 opacity-50"></i> 尚未產生賽事</div>`;
            } else {
                Object.keys(rounds).sort((a,b) => a - b).forEach(roundNumber => {
                    const roundMatches = rounds[roundNumber];
                    const isHighestRound = parseInt(roundNumber) === highestRoundNumber;
                    
                    // 判斷該輪是否全新未結算 (才能撤銷)
                    const isRoundPristine = isHighestRound && parseInt(roundNumber) > 1 && !roundMatches.some(m => m.status === 'completed');

                    sectionHtml += `
                        <div class="mb-10 last:mb-0">
                            <div class="flex justify-between items-center mb-5">
                                <h3 class="text-sm font-black text-slate-300 tracking-widest uppercase flex items-center">
                                    <span class="w-8 h-[1px] bg-slate-600 mr-3"></span>
                                    Round ${roundNumber}
                                    <span class="w-8 h-[1px] bg-slate-600 ml-3"></span>
                                </h3>
                                ${isRoundPristine ? `
                                    <button onclick="window.undoLastRound('${bracketType}')" class="text-xs text-rose-400 hover:text-rose-300 hover:bg-rose-900/30 px-3 py-1.5 rounded-lg border border-rose-500/30 transition-all flex items-center shadow-sm">
                                        <i data-lucide="rotate-ccw" class="w-3 h-3 mr-1.5"></i> 撤銷此輪
                                    </button>
                                ` : ''}
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                                ${roundMatches.map(m => renderMatchCard(m)).join('')}
                            </div>
                        </div>
                    `;
                });
            }

            // 動態產生下一輪的操作列
            const actionBtnLogic = bracketType === 'winners' ? 'window.generateNextWinnersRound()' : 'window.generateNextLosersRound()';
            const inputId = bracketType === 'winners' ? 'nextSize_winners' : 'nextSize_losers';
            
            let footerHtml = `
                <div class="mt-8 p-5 bg-slate-900/80 rounded-2xl border border-slate-700/50 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0 shadow-inner">
            `;
            
            if (bracketType === 'losers') {
                footerHtml += `
                    <div class="flex items-center">
                        <span class="text-rose-400 font-bold mr-3 flex items-center"><i data-lucide="skull" class="w-4 h-4 mr-2"></i> 待戰區：</span>
                        <span class="text-white text-sm bg-rose-600 px-3 py-1.5 rounded-lg shadow-lg shadow-rose-600/30 font-black">${appState.losersPool.length} 人</span>
                    </div>`;
            } else {
                footerHtml += `<div class="flex items-center text-slate-400 text-sm font-medium"><i data-lucide="info" class="w-4 h-4 mr-2"></i> 所有比賽結算後可產生下一輪</div>`;
            }

            footerHtml += `
                    <div class="flex items-center space-x-4 w-full sm:w-auto flex-wrap sm:flex-nowrap justify-end gap-y-3">
                        <!-- 🌟 新增：產生下一輪時的分配模式切換 -->
                        <label class="flex items-center cursor-pointer text-sm font-bold text-slate-300 hover:text-white transition-colors mr-2">
                            <input type="checkbox" id="autoAssign_${bracketType}" checked class="w-4 h-4 mr-2 rounded border-slate-600 bg-slate-900 text-${colorName}-500 focus:ring-${colorName}-500">
                            系統自動隨機分組
                        </label>
                        <div class="flex items-center bg-slate-800 border border-slate-600 rounded-xl overflow-hidden px-3 py-2 shadow-inner">
                            <span class="text-xs text-slate-400 mr-2 whitespace-nowrap font-bold">對戰人數:</span>
                            <input type="number" id="${inputId}" value="${appState.config.groupSize}" min="2" class="bg-transparent text-${colorName}-400 w-12 outline-none font-black text-center text-lg">
                        </div>
                        <button onclick="${actionBtnLogic}" class="px-6 py-3 bg-${colorName}-600 hover:bg-${colorName}-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-${colorName}-600/30 flex items-center whitespace-nowrap group">
                            <i data-lucide="zap" class="w-4 h-4 mr-2 group-hover:scale-125 transition-transform"></i> 產生下一輪
                        </button>
                    </div>
                </div>
            `;

            sectionHtml += footerHtml + `</section>`;
            return sectionHtml;
        }

        function renderMatchCard(match) {
            const isCompleted = match.status === 'completed';
            const isFull = match.participants.length >= appState.config.groupSize;
            
            let cardHtml = `
                <div class="bg-slate-800/80 rounded-2xl border border-slate-700 overflow-hidden transition-all flex flex-col h-full shadow-lg hover:border-slate-500 hover:shadow-xl relative">
                    <div class="bg-slate-900/80 px-4 py-2.5 flex justify-between items-center border-b border-slate-700 relative z-10">
                        <span class="text-xs font-black text-slate-400 tracking-wider">${match.title}</span>
                        ${isCompleted 
                            ? `<span class="text-[10px] px-2 py-0.5 bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/20 uppercase font-bold tracking-widest flex items-center"><i data-lucide="check" class="w-3 h-3 mr-1"></i> 已結算</span>` 
                            : `<span class="text-[10px] px-2 py-0.5 bg-blue-500/20 text-blue-400 rounded-full border border-blue-500/20 uppercase font-bold tracking-widest flex items-center"><i data-lucide="swords" class="w-3 h-3 mr-1"></i> 進行中</span>`
                        }
                    </div>
                    
                    ${selectedPlayerId && !isCompleted && !isFull ? `
                        <div onclick="window.assignPlayerToMatch('${match.id}')" class="absolute inset-0 bg-indigo-500/20 border-2 border-indigo-400 rounded-2xl cursor-pointer flex items-center justify-center z-20 backdrop-blur-[2px] transition-all hover:bg-indigo-500/30">
                            <span class="bg-slate-900 px-5 py-2.5 rounded-full text-indigo-400 font-black shadow-xl flex items-center border border-indigo-500/50"><i data-lucide="download" class="w-4 h-4 mr-2"></i>分配至此</span>
                        </div>
                    ` : ''}

                    <div class="p-3 flex-grow space-y-2 relative z-10">
            `;

            match.participants.forEach(player => {
                const isWinner = isCompleted && match.winnerId === player.id;
                const isLoser = isCompleted && match.winnerId !== player.id;

                let boxStyles = isWinner 
                    ? 'bg-gradient-to-r from-emerald-900/40 to-slate-800 border-emerald-500/50 text-emerald-400 font-bold shadow-[inset_2px_0_0_#10b981]' 
                    : isLoser 
                        ? 'bg-slate-900/50 border-slate-800 text-slate-600 line-through opacity-50 shadow-[inset_2px_0_0_#475569]' 
                        : 'bg-slate-700/30 border-slate-600 text-slate-200 hover:bg-slate-600 cursor-pointer shadow-[inset_2px_0_0_#3b82f6]';

                // 🌟 當前有選取待分配選手時，鎖定點擊結算功能，避免誤觸
                const clickEvent = (!isCompleted && !selectedPlayerId) ? `onclick="window.resolveMatch('${match.id}', '${player.id}')"` : '';

                // 趣味圖示判斷
                let iconHtml = '';
                if (isWinner) {
                    iconHtml = `<i data-lucide="crown" class="w-4 h-4 text-yellow-400 mr-2 animate-bounce"></i>`;
                } else if (isLoser) {
                    iconHtml = `<i data-lucide="skull" class="w-4 h-4 text-slate-500 mr-2"></i>`;
                } else {
                    iconHtml = `<i data-lucide="swords" class="w-4 h-4 text-slate-400 mr-2 opacity-50"></i>`;
                }

                // 🌟 新增：從賽程中移除玩家的按鈕 (僅限未結算賽事)
                let actionBtn = '';
                if (!isCompleted) {
                    actionBtn = `
                        <button onclick="event.stopPropagation(); window.removePlayerFromMatch('${match.id}', '${player.id}')" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-rose-500/20 text-rose-400 rounded-md transition-all absolute right-2">
                            <i data-lucide="user-minus" class="w-4 h-4"></i>
                        </button>
                    `;
                }

                cardHtml += `
                    <div ${clickEvent} class="flex items-center p-2.5 rounded-xl border transition-all ${boxStyles} group relative overflow-hidden">
                        ${iconHtml}
                        <span class="flex-grow text-sm font-medium truncate pr-8">${player.name}</span>
                        ${!isCompleted && !selectedPlayerId ? `<span class="opacity-0 group-hover:opacity-100 text-[10px] font-bold bg-blue-500 text-white px-2 py-1 rounded-md ml-2 transition-opacity absolute right-2">勝</span>` : ''}
                        ${actionBtn}
                    </div>
                `;
            });
            
            // 🌟 處理不足人數的空位提示
            const emptySlots = appState.config.groupSize - match.participants.length;
            for(let i=0; i<emptySlots; i++) {
                cardHtml += `
                    <div class="flex items-center p-2.5 rounded-xl border border-slate-700/50 border-dashed bg-slate-800/20 opacity-50">
                        <div class="w-4 h-4 rounded-full border-2 border-slate-600 mr-2"></div>
                        <span class="text-sm text-slate-500 italic">等待分配...</span>
                    </div>
                `;
            }

            cardHtml += `</div></div>`;
            return cardHtml;
        }

        function renderVotingScreen() {
            if (!appState.voters || appState.voters.length === 0) {
                return `
                    <div class="glass-panel p-10 rounded-3xl max-w-2xl mx-auto border border-purple-500/20 shadow-2xl relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 opacity-10 pointer-events-none">
                            <i data-lucide="bar-chart-3" class="w-64 h-64 text-purple-500"></i>
                        </div>
                        <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-4 flex items-center relative z-10">
                            <i data-lucide="users-2" class="mr-3 text-purple-400"></i> 匯入預測名單
                        </h2>
                        <p class="text-slate-400 text-sm mb-6 leading-relaxed relative z-10">請貼上參與賽事預測的觀眾名單。<br>當勝部賽事推進至 <strong class="text-amber-400">8 強（含）以內</strong> 時，將解鎖「點擊分配」功能，為預測者分派選票！</p>
                        <textarea id="voterInputList" rows="6" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-200 focus:ring-2 focus:ring-purple-500 outline-none resize-y mb-6 shadow-inner relative z-10" placeholder="觀眾 A\n觀眾 B\n..."></textarea>
                        <button onclick="window.setupVoters()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white rounded-xl font-black text-lg transition-all shadow-lg shadow-purple-600/30 flex justify-center items-center relative z-10">
                            <i data-lucide="check-circle-2" class="w-6 h-6 mr-2"></i> 建立預測名單
                        </button>
                    </div>
                `;
            }

            const alivePlayers = getAlivePlayers();
            const unassignedVoters = appState.voters.filter(v => !v.votedFor);
            const isTop8Phase = alivePlayers.length > 0 && alivePlayers.length <= 8;

            let html = `<div class="space-y-6">`;

            // 狀態列
            html += `
                <div class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                    <div class="flex items-center">
                        <div class="p-2 bg-slate-900 rounded-lg mr-4 border border-slate-700">
                            <span class="text-slate-400 text-sm">勝部存活：<strong class="text-white text-xl ml-1">${alivePlayers.length}</strong> 人</span>
                        </div>
                        ${isTop8Phase 
                            ? `<span class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-lg shadow-orange-500/30 rounded-full text-xs font-black animate-pulse flex items-center"><i data-lucide="flame" class="w-4 h-4 mr-1"></i> 8 強預測解鎖</span>`
                            : `<span class="px-4 py-1.5 bg-slate-700 text-slate-400 border border-slate-600 rounded-full text-xs font-bold flex items-center"><i data-lucide="lock" class="w-3 h-3 mr-1"></i> 等待推進至 8 強</span>`
                        }
                    </div>
                    <button onclick="window.resetVoters()" class="text-xs text-slate-400 hover:text-rose-400 underline flex items-center transition-colors">
                        <i data-lucide="trash" class="w-3 h-3 mr-1"></i> 清空名單
                    </button>
                </div>
            `;

            if (isTop8Phase) {
                html += `
                    <div class="bg-blue-900/20 border border-blue-500/30 p-4 rounded-xl text-blue-300 text-sm flex items-start shadow-inner">
                        <i data-lucide="info" class="w-5 h-5 mr-3 flex-shrink-0 mt-0.5 text-blue-400"></i>
                        <div>
                            <p class="font-bold mb-1 text-blue-200">極速分配指南</p>
                            <p class="text-blue-300/80">1. 點擊左側「待分配者」使其發光。<br>2. 點擊右側「選手卡片」，完成選票綁定！</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 mt-6">
                `;

                // 左欄：未分配名單
                html += `
                    <div class="lg:col-span-1 glass-panel p-6 rounded-2xl border border-slate-700 max-h-[600px] overflow-y-auto">
                        <h3 class="font-black text-slate-300 mb-5 border-b border-slate-700/50 pb-3 flex items-center">
                            <i data-lucide="user-plus" class="w-5 h-5 mr-2 text-indigo-400"></i> 待分配 (${unassignedVoters.length})
                        </h3>
                        <div class="flex flex-wrap gap-2.5">
                            ${unassignedVoters.map(v => `
                                <button onclick="window.selectVoter('${v.id}')" 
                                        class="voter-chip px-3 py-1.5 rounded-lg text-sm font-bold transition-all border shadow-sm ${selectedVoterId === v.id ? 'selected' : 'bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700'}">
                                    ${v.name}
                                </button>
                            `).join('')}
                            ${unassignedVoters.length === 0 ? '<div class="flex flex-col items-center justify-center w-full py-10 opacity-50"><i data-lucide="check-circle" class="w-10 h-10 mb-2 text-emerald-500"></i><p class="text-sm italic text-slate-400">全數分配完畢</p></div>' : ''}
                        </div>
                    </div>
                `;

                // 右欄：選手卡片
                html += `<div class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">`;
                
                alivePlayers.forEach(player => {
                    const votersForThis = appState.voters.filter(v => v.votedFor === player.id);
                    const cardAction = selectedVoterId ? `onclick="window.assignVoteToPlayer('${player.id}')"` : '';
                    const selectableClass = selectedVoterId ? 'selectable border-amber-500/50 bg-slate-800/80 cursor-pointer' : 'border-slate-700 bg-slate-800/40';

                    html += `
                        <div ${cardAction} class="player-card p-5 rounded-2xl border transition-all ${selectableClass} shadow-lg relative overflow-hidden group">
                            <!-- 裝飾背景色塊 -->
                            <div class="absolute top-0 right-0 w-24 h-24 bg-purple-500/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>

                            <div class="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-4 relative z-10">
                                <span class="font-black text-lg text-white flex items-center">
                                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center mr-3 shadow-md">
                                        <i data-lucide="user" class="w-4 h-4 text-white"></i>
                                    </div>
                                    ${player.name}
                                </span>
                                <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full font-black border border-indigo-500/30">
                                    ${votersForThis.length} 票
                                </span>
                            </div>
                            
                            <div class="min-h-[80px] bg-slate-900/60 rounded-xl p-3 flex flex-wrap gap-2 content-start border border-slate-700/50 relative z-10">
                                ${votersForThis.length === 0 ? '<span class="text-xs text-slate-500 italic mt-2 ml-2 flex items-center"><i data-lucide="ghost" class="w-3 h-3 mr-1"></i> 尚無人看好</span>' : ''}
                                ${votersForThis.map(v => `
                                    <div class="flex items-center bg-slate-700/80 border border-slate-600 text-slate-200 text-xs px-2.5 py-1 rounded-lg group/btn shadow-sm">
                                        <span class="font-medium">${v.name}</span>
                                        <button onclick="event.stopPropagation(); window.removeVote('${v.id}')" class="ml-2 text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 rounded p-0.5 focus:outline-none transition-colors">
                                            <i data-lucide="x" class="w-3 h-3"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                            
                            ${selectedVoterId ? `
                                <div class="absolute inset-0 bg-amber-500/5 border-2 border-amber-500/50 rounded-2xl pointer-events-none flex items-end justify-center pb-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <span class="text-xs text-amber-400 font-bold bg-slate-900/80 px-3 py-1 rounded-full"><i data-lucide="mouse-pointer-click" class="w-3 h-3 inline mr-1"></i> 分配至此</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += `</div></div>`;

            } else {
                html += `
                    <div class="glass-panel p-12 rounded-3xl border border-slate-700 flex flex-col items-center justify-center text-center">
                        <div class="bg-slate-800 p-5 rounded-full mb-6 border border-slate-700 shadow-xl relative">
                            <i data-lucide="lock" class="w-12 h-12 text-slate-500"></i>
                            <i data-lucide="sparkles" class="w-6 h-6 text-amber-500 absolute -top-1 -right-1 animate-pulse"></i>
                        </div>
                        <h3 class="text-3xl font-black text-white mb-3 tracking-wide">投票分配尚未解鎖</h3>
                        <p class="text-slate-400 mb-8 max-w-md">目前勝部還有 <strong class="text-indigo-400 text-lg">${alivePlayers.length}</strong> 名選手。<br>請至「賽程看板」繼續推進比賽至 8 強以內。</p>
                        
                        <div class="w-full max-w-2xl bg-slate-900/50 p-6 rounded-2xl border border-slate-700 text-left shadow-inner">
                            <p class="text-sm text-slate-400 font-bold mb-4 border-b border-slate-700/50 pb-3 flex items-center">
                                <i data-lucide="check-circle" class="w-4 h-4 mr-2 text-emerald-500"></i> 已就緒名單 (${appState.voters.length} 人)
                            </p>
                            <div class="flex flex-wrap gap-2">
                                ${appState.voters.map(v => `<span class="px-2.5 py-1 bg-slate-800 text-slate-400 text-xs rounded-lg border border-slate-700 shadow-sm font-medium">${v.name}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            return html;
        }

        // 啟動應用前，先判斷登入狀態再決定是否讀取資料
        if (isLoggedIn) {
            initApp();
        } else {
            isLoading = false;
            render();
        }

    </script>
</body>
</html>
